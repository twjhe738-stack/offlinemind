name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests, lint, and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK has no INTERNET permission
        run: |
          python3 scripts/check_no_internet_permission.py \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offlinemind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
